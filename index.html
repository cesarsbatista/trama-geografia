let view='home',selectedGrade='8',filter='all',search='',portalClass='801',modal='',editId=null,toastTimer=null;

const nav=[['home','Visão geral','home'],['planning','Planejamento','calendar'],['library','Biblioteca','books'],['classes','Minhas turmas','users'],['materials','Materiais','folder'],['student','Portal do aluno','eye'],['settings','Ajustes','settings']];

function renderNav(){document.querySelector('#brandicon').innerHTML='<img src="icons/trama-192.png" alt="Símbolo TRAMA" width="45" height="45">';document.querySelector('#sidenav').innerHTML=nav.map(([id,label,ico])=>`<button class="nav-btn ${view===id?'active':''}" data-nav="${id}">${ic(ico)} ${label} ${id==='materials'?`<span class="n-count">${state.activities.length}</span>`:''}</button>`).join('');document.querySelector('#mobilenav').innerHTML=nav.filter(n=>mobile.includes(n[0])).map(([id,label,ico])=>`<button data-nav="${id}" class="${view===id?'active':''}">${ic(ico)}<span>${id==='home'?'Início':id==='planning'?'Planos':id==='library'?'Biblioteca':id==='materials'?'Materiais':'Alunos'}</span></button>`).join('');document.querySelector('#crumb').textContent=nav.find(n=>n[0]===view)?.[1]||'Visão geral';document.querySelector('#year-pill').innerHTML=ic('calendar')+' '+state.year;document.querySelector('#theme-toggle').innerHTML=ic(resolvedTheme()==='dark'?'sun':'moon')}
function resolvedTheme(){return state.theme==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):state.theme}

function home(){let published=state.activities.filter(a=>a.published);let cells=grades.map(g=>`<button class="grade" data-grade="${g.id}"><div class="grade-icon">${ic(g.id==='6'||g.id==='7'?'map':g.id==='8'?'globe':'layers')}</div><strong>${g.label}</strong><span>${g.level==='Ensino Médio'?'Ens. Médio':'Fund. II'}</span><div class="progress"><i style="width:${g.progress}%"></i></div></button>`).join('');return `<div class="page"><div class="pagehead"><div><div class="kicker">SEU ESPAÇO DE ENSINO</div><h1>Olá, César.</h1><p>Seu planejamento de Geografia, organizado em um só lugar.</p></div><button class="primary" data-action="new-activity">${ic('plus')} Nova atividade</button></div><section class="hero glass"><div class="hero-copy"><div class="hero-eyebrow"><span class="dot"></span> GEOGRAFIA EM CONEXÃO</div><h2>Conhecimento que conecta. Planejamento que transforma.</h2><p>Conteúdos, aulas e materiais sempre prontos para acompanhar você em cada novo ano letivo.</p><div class="hero-actions"><button class="primary" data-nav="planning">Explorar planejamento ${ic('arrow')}</button><button class="primary outline" data-nav="student">${ic('eye')} Visão do aluno</button></div></div>${heroGraphic()}</section><div class="stats"><div class="stat glass"><div class="stat-label">${ic('books')} Etapas e séries</div><div class="stat-value">07</div><div class="stat-sub">Do 6º ano à 3ª série</div></div><div class="stat glass"><div class="stat-label">${ic('calendar')} Períodos letivos</div><div class="stat-value">03</div><div class="stat-sub">Planejamento trimestral</div></div><div class="stat glass"><div class="stat-label">${ic('users')} Turmas cadastradas</div><div class="stat-value">${String(state.classes.length).padStart(2,'0')}</div><div class="stat-sub">Ano letivo ${state.year}</div></div><div class="stat glass"><div class="stat-label">${ic('folder')} Materiais publicados</div><div class="stat-value">${String(published.length).padStart(2,'0')}</div><div class="stat-sub">Disponíveis aos alunos</div></div></div><div class="section-title"><div><h2>Explore por ano de escolaridade</h2><p>Planejamentos e conteúdos reunidos por série.</p></div><button class="ghost" data-nav="planning">Ver todos ${ic('arrow')}</button></div><div class="gradegrid">${cells}</div><div class="lower"><section class="panel glass"><div class="panelhead"><h3>Percursos curriculares</h3><span class="chip">${ic('layers')} Exemplo didático</span></div>${[['8º ano · 2º trimestre','Globalização e redes','8'],['2ª série · 2º trimestre','Urbanização e metropolização','2'],['6º ano · 1º trimestre','Orientação e cartografia','6']].map(([s,t,id],i)=>`<div class="listrow" role="button" tabindex="0" data-grade="${id}"><div class="numicon">0${i+1}</div><div class="listtext"><b>${t}</b><p>${s}</p></div><span class="arrow">${ic('chevron')}</span></div>`).join('')}<div class="mini-foot"><span>Organização demonstrativa, ainda sem códigos oficiais vinculados.</span></div></section><section class="panel glass"><div class="panelhead"><h3>Publicações recentes</h3><button class="ghost" data-nav="materials">Gerenciar ${ic('arrow')}</button></div>${published.length?published.slice(0,3).map((a)=>`<div class="listrow" data-preview="${esc(a.id)}" role="button" tabindex="0"><div class="numicon">${ic('file')}</div><div class="listtext"><b>${esc(a.title)}</b><p>${grade(a.grade).label} · ${esc(a.classes.join(', '))}</p></div><span class="chip green">Publicado</span></div>`).join(''):'<div class="empty">Nenhum material publicado ainda.</div>'}<div class="mini-foot"><span>Visualização pública apenas para consulta e download.</span></div></section></div><div class="soft-note glass info-row">${ic('globe')} Referências curriculares previstas: BNCC, CRMG e planos de curso da SEE-MG. Os conteúdos desta versão são ilustrativos.</div></div>`}
function planningView(){let g=grade(selectedGrade),planned=planning[selectedGrade];let custom=state.customUnits.filter(u=>u.grade===selectedGrade);return `<div class="page">${header('Planejamento curricular','Uma visão trimestral de conteúdos por ano de escolaridade.','PLANEJAMENTO ANUAL',`<button class="primary" data-action="new-unit">${ic('plus')} Adicionar conteúdo</button>`)}<div class="intro-box glass">${ic('map')}<p><b>Referências: BNCC · CRMG · SEE-MG</b><br>Este protótipo apresenta sequências temáticas ilustrativas. A correspondência com habilidades e planos de curso oficiais será incorporada após a validação dos documentos.</p></div><div class="year-tabs">${grades.map(x=>`<button class="year-tab ${selectedGrade===x.id?'active':''}" data-grade="${x.id}">${x.label}</button>`).join('')}</div><div class="section-title" style="margin-top:22px"><div><h2>${g.label} <span class="muted" style="font-weight:500">· ${g.theme}</span></h2><p>${g.level} · ${state.year} · 3 trimestres</p></div><span class="chip neutral">Rascunho curricular</span></div><div class="trimester-grid">${planned.map((units,i)=>`<section class="trimester-card glass"><div class="tri-num">0${i+1} / Trimestre</div><h3>${['Primeiro','Segundo','Terceiro'][i]} trimestre</h3><p class="small">Objetos de conhecimento e temas em sequência didática.</p>${units.concat(custom.filter(x=>Number(x.tri)===i+1).map(x=>x.title)).map((u,j)=>`<div class="unit" data-unit="${selectedGrade}|${i+1}|${encodeURIComponent(u)}"><strong>${esc(u)}</strong><p>${j===0?'Tema de abertura e contextualização':'Aprofundamento, análise e atividades'}</p><div class="metadata"><span>Planejamento</span><span>Geografia</span></div></div>`).join('')}<div class="divider"></div><div class="info-row">${ic('calendar')} Distribuição ajustável por turma em versão futura</div></section>`).join('')}</div></div>`}
function libraryView(){let q=search.trim().toLowerCase();let list=grades.filter(g=>(filter==='all'||(filter==='fund'&&g.level==='Fundamental II')||(filter==='med'&&g.level==='Ensino Médio'))&&(`${g.label} ${g.theme} ${g.level} ${planning[g.id].flat().join(' ')}`.toLowerCase().includes(q)));return `<div class="page">${header('Biblioteca de Geografia','Um acervo permanente para reutilizar e atualizar ao longo dos anos.','BIBLIOTECA PEDAGÓGICA')}<div class="toolbar"><label class="search">${ic('search')}<input id="library-search" value="${esc(search)}" placeholder="Buscar temas, séries e conteúdos..." aria-label="Buscar na biblioteca"></label><div class="filters"><button class="filter-btn ${filter==='all'?'active':''}" data-filter="all">Todos</button><button class="filter-btn ${filter==='fund'?'active':''}" data-filter="fund">Fundamental II</button><button class="filter-btn ${filter==='med'?'active':''}" data-filter="med">Ensino Médio</button></div></div><div class="catalog">${list.map(g=>`<section class="catalog-card glass"><div class="decor">${ic('globe')}</div><h3>${g.label}</h3><p>${esc(g.theme)}. ${planning[g.id].flat().slice(0,3).join(' · ')}.</p><footer><span>${planning[g.id].flat().length+state.customUnits.filter(x=>x.grade===g.id).length} tópicos sugeridos</span><button class="ghost" data-grade="${g.id}">Explorar ${ic('arrow')}</button></footer></section>`).join('')||'<div class="empty glass">Nenhum tema encontrado. Tente outra busca.</div>'}</div></div>`}
function classesView(){return `<div class="page">${header('Minhas turmas','Organize suas turmas a cada ano, sem perder seu acervo pedagógico.','ANO LETIVO '+state.year,`<button class="primary" data-action="new-class">${ic('plus')} Adicionar turma</button>`)}<div class="intro-box glass">${ic('users')}<p><b>Turmas independentes da biblioteca.</b><br>Você pode mudar de escola a cada ano e preservar o planejamento e os materiais. Não existe cadastro de alunos nesta proposta.</p></div><div class="cards2">${state.classes.map(c=>`<div class="class-card glass"><div class="class-top"><div class="class-code">${esc(c.name)}</div><span class="chip green">Ativa</span></div><h3>Turma ${esc(c.name)}</h3><p>${grade(c.grade).label} · ${esc(c.shift)}<br>${esc(c.school)}</p><div class="class-foot"><span class="info-row">${ic('file')} ${state.activities.filter(a=>a.published&&a.classes.includes(c.id)).length} publicações</span><button class="ghost" data-class="${esc(c.id)}">Abrir portal ${ic('arrow')}</button></div></div>`).join('')||'<p class="empty">Nenhuma turma cadastrada.</p>'}</div></div>`}
function filteredActivities(){let q=search.toLowerCase();return state.activities.filter(a=>(filter==='all'||(filter==='pub'&&a.published)||(filter==='draft'&&!a.published))&&(`${a.title} ${a.description} ${grade(a.grade).label}`.toLowerCase().includes(q)))}
function materialsView(){const list=filteredActivities();return `<div class="page">${header('Materiais e atividades','Crie uma vez e compartilhe com diferentes turmas.','ACERVO DE ATIVIDADES',`<button class="primary" data-action="new-activity">${ic('plus')} Nova atividade</button>`)}<div class="toolbar"><label class="search">${ic('search')}<input id="materials-search" value="${esc(search)}" placeholder="Buscar atividades..." aria-label="Buscar atividades"></label><div class="filters"><button class="filter-btn ${filter==='all'?'active':''}" data-filter="all">Todos</button><button class="filter-btn ${filter==='pub'?'active':''}" data-filter="pub">Publicados</button><button class="filter-btn ${filter==='draft'?'active':''}" data-filter="draft">Rascunhos</button></div></div><section class="glass table-wrap">${list.map(a=>`<div class="itemrow"><div><div class="item-title">${esc(a.title)}</div><div class="itemdesc">${esc(a.description)}</div></div><div><span class="chip neutral">${grade(a.grade).label} · ${a.tri}º tri.</span></div><div><span class="chip ${a.published?'green':'amber'}">${a.published?'● Publicado':'○ Rascunho'}</span></div><div class="item-action"><button class="tinybutton" data-preview="${esc(a.id)}" title="Visualizar">${ic('eye')} Ver</button><button class="tinybutton" data-download="${esc(a.id)}" title="Baixar PDF">${ic('download')} PDF</button><button class="tinybutton" data-toggle="${esc(a.id)}">${a.published?'Ocultar':'Publicar'}</button><button class="tinybutton" data-edit="${esc(a.id)}" title="Editar">${ic('edit')}</button></div></div>`).join('')||'<div class="empty">Nenhum material corresponde à busca.</div>'}</section><div class="soft-note glass">Os novos materiais são salvos neste navegador para demonstração. A publicação em uma página pública real exigirá hospedagem e armazenamento compartilhado.</div></div>`}
function studentView(){const c=state.classes.find(c=>c.id===portalClass)||state.classes[0];if(c)portalClass=c.id;const list=c?state.activities.filter(a=>a.published&&a.classes.includes(c.id)):[];return `<div class="page"><div class="public-brand"><div class="brand-mark"><img src="icons/trama-192.png" alt="Símbolo TRAMA" width="40" height="40"></div><b>TRAMA</b><small>PORTAL DO ESTUDANTE</small></div><div class="pagehead"><div><div class="kicker">PRÉVIA · PORTAL DEMONSTRATIVO</div><h1>Área do aluno</h1><p>Uma página de materiais, sem login e sem cadastro.</p></div><button class="secondary" data-nav="materials">${ic('arrow')} Voltar ao professor</button></div><section class="student-banner glass"><div style="position:relative;z-index:1"><div class="kicker">GEOGRAFIA · MATERIAIS DE AULA</div><h2>Explore. Aprenda. Descubra.</h2><p>Atividades e materiais disponibilizados pelo professor.<br>Visualize ou baixe o conteúdo para estudar.</p></div></section><div class="student-select"><label for="class-select" style="font-size:12px;font-weight:750;color:var(--muted)">Selecione sua turma</label><select id="class-select" aria-label="Selecionar turma">${state.classes.map(s=>`<option value="${esc(s.id)}" ${s.id===portalClass?'selected':''}>Turma ${esc(s.name)} · ${grade(s.grade).label}</option>`).join('')}</select><span class="chip neutral">${list.length} ${list.length===1?'material':'materiais'}</span></div><section class="glass" style="padding:6px 16px"><div class="panelhead" style="margin:16px 3px"><h3>Materiais disponíveis ${c?'· '+esc(c.name):''}</h3><span class="chip green">Acesso livre</span></div>${list.length?list.map(a=>`<div class="studentdoc"><div class="filebadge">${ic('file')}</div><div class="docmain"><b>${esc(a.title)}</b><p>${esc(a.type)} · ${a.tri}º trimestre · ${esc(a.description)}</p></div><div class="docbtns"><button class="secondary" data-preview="${esc(a.id)}">${ic('eye')} Visualizar</button><button class="primary" data-download="${esc(a.id)}">${ic('download')} Baixar PDF</button></div></div>`).join(''):'<div class="empty">Nenhuma atividade publicada para esta turma no momento.</div>'}</section><div class="soft-note glass">${ic('check')} Nenhuma conta é necessária para acessar estes materiais. Esta é uma prévia local do portal: links compartilháveis entre dispositivos serão configurados na versão publicada.</div></div>`}
function settingsView(){return `<div class="page">${header('Ajustes','Configurações da versão demonstrativa.','PREFERÊNCIAS DO APP')}<div class="settings-panels"><section class="settings-card glass"><h3>Aparência</h3><p>Use a mesma proposta visual do Rail Control, com superfícies translúcidas e temas ajustáveis.</p><div class="theme-options">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([id,label])=>`<button class="theme-opt ${state.theme===id?'active':''}" data-theme="${id}">${label}</button>`).join('')}</div><div class="divider"></div><h3>Ano de referência</h3><div class="field"><label for="year-input">Ano letivo de exemplo</label><input type="number" min="2025" max="2100" id="year-input" value="${state.year}"></div><button class="secondary" data-action="save-year" style="margin-top:13px">Atualizar ano</button></section><section class="settings-card glass"><h3>Dados da demonstração</h3><p>Todos os dados adicionados por você ficam guardados apenas no armazenamento local deste navegador.</p><div class="statline"><span>Turmas</span><b>${state.classes.length}</b></div><div class="statline"><span>Atividades</span><b>${state.activities.length}</b></div><div class="statline"><span>Materiais publicados</span><b>${state.activities.filter(x=>x.published).length}</b></div><div class="divider"></div><button class="secondary" data-action="export-json">${ic('download')} Exportar dados (JSON)</button><button class="secondary" data-action="reset-data" style="margin-top:8px">${ic('refresh')} Restaurar exemplo</button></section></div><div class="soft-note glass">Versão inicial: ainda não há servidor, autenticação do professor, upload de arquivos externos nem sincronização entre dispositivos. A plataforma real exigirá esses componentes e políticas de acesso.</div></div>`}

function renderModal(){const root=document.querySelector('#modal-root');let body='';if(modal==='activity'){const a=state.activities.find(x=>x.id===editId)||{title:'',grade:selectedGrade,tri:1,type:'Atividade',description:'',body:'',published:false,classes:[]};body=`<div class="modal-head"><div><div class="kicker">${editId?'EDITAR MATERIAL':'NOVO MATERIAL'}</div><h2>${editId?'Editar atividade':'Criar atividade'}</h2></div><button class="iconbutton" data-close aria-label="Fechar">${ic('close')}</button></div><form id="activity-form"><div class="formgrid"><label class="field full">Título da atividade<input name="title" required maxlength="120" placeholder="Ex.: Urbanização brasileira" value="${esc(a.title)}"></label><label class="field">Ano de escolaridade<select name="grade">${grades.map(x=>`<option value="${x.id}" ${a.grade===x.id?'selected':''}>${x.label}</option>`).join('')}</select></label><label class="field">Trimestre<select name="tri">${[1,2,3].map(n=>`<option value="${n}" ${a.tri==n?'selected':''}>${n}º trimestre</option>`).join('')}</select></label><label class="field">Tipo de material<select name="type">${['Atividade','Estudo dirigido','Revisão','Avaliação','Texto de apoio'].map(x=>`<option ${x===a.type?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Publicação<select name="published"><option value="false" ${!a.published?'selected':''}>Salvar como rascunho</option><option value="true" ${a.published?'selected':''}>Publicar para turmas</option></select></label><label class="field full">Resumo<input name="description" maxlength="210" value="${esc(a.description)}" placeholder="Breve descrição do material"></label><label class="field full">Questões ou texto da atividade<textarea name="body" required placeholder="Escreva as questões, uma por linha...">${esc(a.body)}</textarea><span class="hint">Este protótipo gera o PDF a partir do texto digitado. Anexos serão incluídos posteriormente.</span></label><div class="field full"><span>Publicar nas turmas</span><div class="metadata" style="margin-top:1px">${state.classes.map(c=>`<label style="display:inline-flex;align-items:center;gap:5px;padding:9px 11px;border:1px solid #d8e5f0;border-radius:12px;background:var(--glass);font-size:11px"><input type="checkbox" name="classes" value="${esc(c.id)}" ${a.classes.includes(c.id)?'checked':''}> ${esc(c.name)} (${grade(c.grade).label})</label>`).join('')}</div></div></div><div class="modal-footer"><button class="secondary" type="button" data-close>Cancelar</button><button class="primary" type="submit">${ic('check')} ${editId?'Salvar alterações':'Criar atividade'}</button></div></form>`}
else if(modal==='class'){body=`<div class="modal-head"><div><div class="kicker">ANO LETIVO</div><h2>Adicionar turma</h2></div><button class="iconbutton" data-close>${ic('close')}</button></div><form id="class-form"><div class="formgrid"><label class="field">Identificação da turma<input name="name" required maxlength="15" placeholder="Ex.: 901"></label><label class="field">Ano de escolaridade<select name="grade">${grades.map(g=>`<option value="${g.id}">${g.label}</option>`).join('')}</select></label><label class="field full">Escola<input name="school" maxlength="100" value="Escola demonstrativa"></label><label class="field">Turno<select name="shift"><option>Manhã</option><option>Tarde</option><option>Noite</option></select></label></div><div class="modal-footer"><button type="button" class="secondary" data-close>Cancelar</button><button type="submit" class="primary">${ic('plus')} Adicionar turma</button></div></form>`}
else if(modal==='unit'){body=`<div class="modal-head"><div><div class="kicker">BIBLIOTECA CURRICULAR</div><h2>Adicionar conteúdo</h2></div><button class="iconbutton" data-close>${ic('close')}</button></div><form id="unit-form"><div class="formgrid"><label class="field full">Nome do conteúdo<input name="title" required maxlength="90" placeholder="Ex.: Geografia das mudanças climáticas"></label><label class="field">Ano de escolaridade<select name="grade">${grades.map(g=>`<option value="${g.id}" ${g.id===selectedGrade?'selected':''}>${g.label}</option>`).join('')}</select></label><label class="field">Trimestre<select name="tri"><option value="1">1º trimestre</option><option value="2">2º trimestre</option><option value="3">3º trimestre</option></select></label></div><div class="modal-footer"><button class="secondary" type="button" data-close>Cancelar</button><button class="primary" type="submit">${ic('plus')} Salvar conteúdo</button></div></form>`}
else if(modal.startsWith('preview:')){let a=state.activities.find(a=>a.id===modal.slice(8));if(!a){modal='';render();return}body=`<div class="modal-head"><div><div class="kicker">PRÉVIA DE DOCUMENTO</div><h2>${esc(a.type)}</h2></div><button class="iconbutton" data-close>${ic('close')}</button></div><div class="preview-paper"><div class="paper-head"><b style="font-size:13px;color:#287a5a;letter-spacing:1px">TRAMA · GEOGRAFIA</b><div class="paper-small" style="margin-top:7px">${grade(a.grade).label} · ${a.tri}º trimestre · ${state.year} · Material demonstrativo</div></div><h3>${esc(a.title)}</h3><p style="color:#61758b;font-size:12px">${esc(a.description)}</p><div style="margin:20px 0;font-size:12px">Nome: ___________________________________ &nbsp; Turma: __________</div><pre>${esc(a.body)}</pre></div><div class="modal-footer"><button class="secondary" data-close>Fechar</button><button class="primary" data-download="${esc(a.id)}">${ic('download')} Baixar PDF</button></div>`}
else if(modal.startsWith('unit:')){const [gid,t,title]=modal.slice(5).split('|');const unit=decodeURIComponent(title||'');body=`<div class="modal-head"><div><div class="kicker">PERCURSO CURRICULAR · ${grade(gid).label}</div><h2>${esc(unit)}</h2></div><button class="iconbutton" data-close>${ic('close')}</button></div><p style="line-height:1.7;color:var(--muted)">Tema sugerido para o ${esc(t)}º trimestre. Nesta versão inicial, a organização é ilustrativa e será detalhada posteriormente com habilidades da BNCC, do CRMG e os planos de curso vigentes da SEE-MG.</p><div class="metadata"><span>${grade(gid).level}</span><span>${grade(gid).label}</span><span>${esc(t)}º trimestre</span></div><div class="modal-footer"><button class="secondary" data-close>Voltar</button><button class="primary" data-action="new-activity">${ic('plus')} Criar atividade</button></div>`}
root.innerHTML=`<div class="dialog-backdrop" data-backdrop><div class="modal ${modal.startsWith('preview:')?'large':''}" role="dialog" aria-modal="true">${body}</div></div>`;}
function closeModal(){modal='';editId=null;document.querySelector('#modal-root').innerHTML=''}
function makePdf(a){const title=a.title,lines=[];const wrap=(text,max=87)=>{for(const raw of text.split(/\r?\n/)){if(!raw.trim()){lines.push('');continue}let words=raw.split(/\s+/),l='';for(let word of words){if(word.length>max){if(l){lines.push(l);l=''}while(word.length>max){lines.push(word.slice(0,max));word=word.slice(max)}}if((l+' '+word).trim().length>max){lines.push(l);l=word}else l=l?l+' '+word:word}if(l)lines.push(l)}};wrap('TRAMA | GEOGRAFIA',87);wrap(grade(a.grade).label+' - '+a.tri+'o trimestre - '+state.year,87);lines.push('');wrap(title,80);lines.push('');wrap(a.description||'',87);lines.push('');wrap('Nome: ______________________________________    Turma: __________',87);lines.push('');wrap(a.body,87);let pageLines=[];for(let i=0;i<lines.length;i+=43)pageLines.push(lines.slice(i,i+43));const n=pageLines.length;const objects=[];objects[1]='<< /Type /Catalog /Pages 2 0 R >>';objects[2]=`<< /Type /Pages /Kids [${pageLines.map((_,i)=>(4+2*i)+' 0 R').join(' ')}] /Count ${n} >>`;objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
const cp=s=>String(s).replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/•/g,'-').replace(/[\u0100-\uffff]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
pageLines.forEach((pg,i)=>{let ops=['0.12 0.24 0.38 rg'];pg.forEach((line,j)=>{let size=j===0&&i===0?16:11;ops.push(`BT /F1 ${size} Tf 50 ${792-j*17} Td (${cp(line)}) Tj ET`)});let stream=ops.join('\n')+'\n';let pid=4+i*2,cid=5+i*2;objects[pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${cid} 0 R >>`;objects[cid]=`<< /Length ${stream.length} >>\nstream\n${stream}endstream`});
function bytes(str){let arr=[];for(let c of str){let n=c.charCodeAt(0);arr.push(n<=255?n:63)}return arr}let out=bytes('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'),offsets=[0];for(let i=1;i<objects.length;i++){offsets[i]=out.length;out.push(...bytes(`${i} 0 obj\n${objects[i]}\nendobj\n`))}let start=out.length;out.push(...bytes(`xref\n0 ${objects.length}\n0000000000 65535 f \n`));for(let i=1;i<objects.length;i++)out.push(...bytes(String(offsets[i]).padStart(10,'0')+' 00000 n \n'));out.push(...bytes(`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`));return new Blob([new Uint8Array(out)],{type:'application/pdf'})}
function downloadPdf(id){const a=state.activities.find(a=>a.id===id);if(!a)return;const blob=makePdf(a),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='geografia-'+a.title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'')+'.pdf';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),900);toast('Arquivo PDF preparado para download.')}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`trama-geografia-${state.year}-dados.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function handleClick(e){const b=e.target.closest('[data-nav],[data-grade],[data-class],[data-action],[data-close],[data-backdrop],[data-filter],[data-preview],[data-download],[data-toggle],[data-edit],[data-unit],[data-theme]');if(!b)return;if(b.hasAttribute('data-backdrop')&&e.target!==b)return;if(b.hasAttribute('data-close')||b.hasAttribute('data-backdrop')){closeModal();return}if(b.dataset.nav){closeModal();navigate(b.dataset.nav);return}if(b.dataset.grade){closeModal();gradeClick(b.dataset.grade);return}if(b.dataset.class){portalClass=b.dataset.class;navigate('student');return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.preview){modal='preview:'+b.dataset.preview;renderModal();return}if(b.dataset.download){downloadPdf(b.dataset.download);return}if(b.dataset.toggle){let a=state.activities.find(a=>a.id===b.dataset.toggle);if(a){if(!a.published&&(!a.classes||!a.classes.length)){editId=a.id;modal='activity';renderModal();toast('Selecione ao menos uma turma para publicar.');return}a.published=!a.published;save();render();toast(a.published?'Material publicado no portal demonstrativo.':'Material retirado do portal.')}return}if(b.dataset.edit){editId=b.dataset.edit;modal='activity';renderModal();return}if(b.dataset.unit){modal='unit:'+b.dataset.unit;renderModal();return}if(b.dataset.theme){state.theme=b.dataset.theme;save();render();return}if(b.dataset.action){switch(b.dataset.action){case 'new-activity':editId=null;modal='activity';renderModal();break;case 'new-class':modal='class';renderModal();break;case 'new-unit':modal='unit';renderModal();break;case 'export-json':exportJson();toast('Dados exportados.');break;case 'reset-data':if(confirm('Deseja restaurar o exemplo? Todos os dados locais criados nesta demonstração serão substituídos.')){state=safeClone(defaults);save();render();toast('Exemplo restaurado.')}break;case 'save-year':{let y=Number(document.querySelector('#year-input')?.value);if(y>=2025&&y<=2100){state.year=y;save();render();toast('Ano letivo atualizado.')}else toast('Informe um ano válido.');break}}}}
function handleSubmit(e){if(!['activity-form','class-form','unit-form'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target);if(e.target.id==='activity-form'){const g=String(f.get('grade'));const classes=f.getAll('classes').filter(c=>state.classes.some(x=>x.id===c&&x.grade===g));const published=f.get('published')==='true';if(published&&!classes.length){toast('Marque uma turma da mesma série antes de publicar.');return}let a={id:editId||'a'+Date.now(),title:String(f.get('title')).trim(),grade:g,tri:Number(f.get('tri')),type:String(f.get('type')),description:String(f.get('description')).trim(),body:String(f.get('body')).trim(),published,classes};if(!a.title||!a.body){toast('Preencha título e texto da atividade.');return}if(editId){let i=state.activities.findIndex(x=>x.id===editId);if(i>=0)state.activities[i]=a}else state.activities.unshift(a);closeModal();save();navigate('materials');toast('Atividade salva com sucesso.')}if(e.target.id==='class-form'){let name=String(f.get('name')).trim();if(!name){toast('Informe a turma.');return}if(state.classes.some(x=>x.id.toLowerCase()===name.toLowerCase())){toast('Já existe uma turma com este identificador.');return}state.classes.push({id:name,name,grade:String(f.get('grade')),school:String(f.get('school')).trim()||'Escola não informada',shift:String(f.get('shift'))});closeModal();save();navigate('classes');toast('Turma cadastrada.')}if(e.target.id==='unit-form'){state.customUnits.push({title:String(f.get('title')).trim(),grade:String(f.get('grade')),tri:Number(f.get('tri'))});selectedGrade=String(f.get('grade'));closeModal();save();navigate('planning');toast('Conteúdo acrescentado ao planejamento.')}}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('input',e=>{if(e.target.id==='library-search'||e.target.id==='materials-search'){search=e.target.value;const pos=e.target.selectionStart;let method=e.target.id==='library-search'?libraryView:materialsView;document.querySelector('#content').innerHTML=method();const input=document.querySelector('#'+e.target.id);input.focus();input.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='class-select'){portalClass=e.target.value;render()}if(e.target.name==='grade'&&e.target.closest('#activity-form')){const g=e.target.value;const group=e.target.form.querySelectorAll('input[name="classes"]');group.forEach(x=>{let c=state.classes.find(t=>t.id===x.value);x.disabled=!c||c.grade!==g;if(x.disabled)x.checked=false});}});document.querySelector('#theme-toggle').addEventListener('click',()=>{state.theme=resolvedTheme()==='dark'?'light':'dark';save();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-grade],[data-preview]')){e.preventDefault();e.target.click()}});applyTheme();render();
})();
</script>
</body></html>
